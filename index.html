<style>
/* ============================================================
   VIIM v4 — light workbench
   Top bar · index · workspace · context
   ============================================================ */
:root{
  --u:8px; --u2:16px; --u3:24px; --u4:32px;
  --top-h:52px; --sub-h:44px;
  --idx-w:clamp(290px,25vw,376px); --ctx-w:clamp(300px,24vw,384px);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --hair:1px; --r1:7px; --r2:11px; --r3:16px;

  --bg:#eef1f6; --paper:#fff; --paper2:#f6f8fb; --paper3:#eaeef5;
  --ink:#0e1a2b; --ink2:#33445c; --dim:#5d6b81; --faint:#93a0b4;
  --line:#e2e8f1; --line2:#cfd8e6;

  --navy:#0b2545; --navy2:#14335c;
  --blue:#1266d4; --blue-lo:#3fa0f5; --blue-hi:#0a4b9e; --blue-wash:#e8f1fd;
  --amber:#b8801a; --amber-lo:#fbbf24; --amber-wash:#fdf6e6;
  --green:#0d7a52; --green-wash:#e7f5ef;
  --red:#b3261e; --red-wash:#fdf1f0;

  --glow:rgba(18,102,212,.18);
  --sh1:0 1px 2px rgba(14,26,43,.06);
  --sh2:0 2px 8px rgba(14,26,43,.08), 0 12px 28px rgba(14,26,43,.07);
  --sh3:0 20px 60px rgba(14,26,43,.20);

  --f:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --t0:12px; --t1:clamp(13px,1.5vh,14.5px); --t2:clamp(15px,1.85vh,17px); --t3:clamp(18px,2.3vh,21px);
  --ease:cubic-bezier(.22,1,.36,1); --ease2:cubic-bezier(.4,0,.2,1);
}
*{ box-sizing:border-box; margin:0; padding:0 }
html,body{ height:100%; overflow:hidden; overscroll-behavior:none }
body{ background:var(--bg); color:var(--ink); font-family:var(--f); font-size:var(--t1);
  line-height:1.6; -webkit-font-smoothing:antialiased; touch-action:manipulation }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer;
  appearance:none; -webkit-appearance:none; -webkit-tap-highlight-color:transparent }
input,textarea,select{ font:inherit; color:inherit }
:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:5px }
[hidden]{ display:none !important }
::selection{ background:var(--blue); color:#fff }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0) }

#app{ position:fixed; inset:0; height:100dvh; height:min(100dvh,100svh); display:grid;
  grid-template-columns:var(--idx-w) minmax(0,1fr);
  grid-template-rows:calc(var(--top-h) + var(--safe-t)) var(--sub-h) minmax(0,1fr) }
body.ctx #app{ grid-template-columns:var(--idx-w) minmax(0,1fr) var(--ctx-w) }
#topbar{ grid-column:1/-1; grid-row:1 }
#subbar{ grid-column:1/-1; grid-row:2 }
#index{ grid-column:1; grid-row:3 }
#work{ grid-column:2; grid-row:3 }
#ctx{ grid-column:3; grid-row:3 }

/* ---------- top bar ---------- */
#topbar{ display:flex; align-items:center; gap:var(--u2); padding:var(--safe-t) var(--u3) 0;
  background:var(--navy); color:#dbe6f5; position:relative; z-index:30 }
#topbar::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
  background:linear-gradient(90deg,var(--blue-lo),var(--amber-lo) 55%,transparent) }
#brand{ display:flex; align-items:center; gap:10px; flex:none }
#brand svg{ width:26px; height:26px }
#brand b{ font-size:17px; font-weight:750; letter-spacing:-.02em; color:#fff }
#brand em{ font-style:normal; font-family:var(--fm); font-size:9px; letter-spacing:.18em;
  color:#7d95b8; text-transform:uppercase; padding-left:9px; border-left:1px solid #23446f }
#gsearch{ flex:1; max-width:560px; display:flex; align-items:center; gap:9px; height:34px;
  background:#12304f; border:1px solid #1d4470; border-radius:9px; padding:0 12px; color:#cddcf0;
  transition:.18s }
#gsearch:hover{ background:#163760 }
#gsearch svg{ width:14px; height:14px; color:#7d95b8; flex:none }
#gsearch span{ flex:1; text-align:left; font-size:13px; color:#8ea6c6 }
#gsearch kbd{ font-family:var(--fm); font-size:10px; background:#0b2440; border:1px solid #1d4470;
  border-radius:5px; padding:2px 6px; color:#7d95b8 }
#topbar .sp{ flex:1 }
.tbtn{ display:flex; align-items:center; gap:7px; height:32px; padding:0 11px; border-radius:8px;
  font-size:12.5px; font-weight:600; color:#c3d4ea; transition:.18s; white-space:nowrap }
.tbtn svg{ width:15px; height:15px }
.tbtn:hover{ background:#173a63; color:#fff }
#role-btn{ background:#173a63; border:1px solid #23507f }
#role-btn b{ color:#fff; font-weight:650 }

/* ---------- sub bar: divisions ---------- */
#subbar{ display:flex; align-items:center; gap:4px; padding:0 var(--u3); background:var(--paper);
  border-bottom:var(--hair) solid var(--line); overflow-x:auto; scrollbar-width:none; z-index:20 }
#subbar::-webkit-scrollbar{ display:none }
.dv{ position:relative; flex:none; padding:0 13px; height:30px; border-radius:8px; font-size:12.5px;
  font-weight:600; color:var(--dim); display:flex; align-items:center; gap:6px; transition:.16s }
.dv:hover{ background:var(--paper3); color:var(--ink) }
.dv.on{ background:var(--blue-wash); color:var(--blue-hi) }
.dv .c{ font-family:var(--fm); font-size:9.5px; color:var(--faint) }
.dv.on .c{ color:var(--blue) }
.dv.mine{ color:var(--green) } .dv.mine.on{ background:var(--green-wash) }

/* ---------- index ---------- */
#index{ display:flex; flex-direction:column; min-height:0; background:var(--paper);
  border-right:var(--hair) solid var(--line) }
.ihead{ flex:none; display:flex; align-items:center; gap:var(--u); padding:9px var(--u2);
  border-bottom:var(--hair) solid var(--line) }
.ihead svg{ width:14px; height:14px; color:var(--faint); flex:none }
#q{ flex:1; min-width:0; height:28px; background:transparent; border:none; font-size:max(16px,13.5px) }
#q:focus{ outline:none } #q::placeholder{ color:var(--faint) }
.ihead:focus-within{ box-shadow:inset 0 -2px 0 var(--blue) }
#n{ font-family:var(--fm); font-size:10px; color:var(--faint); background:var(--paper3);
  border-radius:999px; padding:2px 7px; flex:none }
.ftabs{ flex:none; display:flex; gap:2px; padding:6px var(--u2); border-bottom:var(--hair) solid var(--line);
  background:var(--paper2) }
.ftab{ flex:1; height:26px; border-radius:7px; font-size:11px; font-weight:600; color:var(--dim); transition:.16s }
.ftab:hover{ background:var(--paper3) } .ftab.on{ background:var(--paper); color:var(--blue-hi); box-shadow:var(--sh1) }
#fpanel{ flex:none; max-height:32vh; overflow-y:auto; padding:7px var(--u2) 9px;
  border-bottom:var(--hair) solid var(--line) }
.frow{ display:flex; align-items:center; gap:8px; width:100%; padding:5px 6px; border-radius:7px;
  font-size:12px; text-align:left; transition:background .16s }
.frow:hover{ background:var(--paper2) }
.frow .bx{ width:13px; height:13px; flex:none; border-radius:4px; border:1.5px solid var(--line2);
  display:grid; place-items:center; transition:.16s }
.frow.on .bx{ background:var(--blue); border-color:var(--blue) }
.frow.on .bx::after{ content:""; width:6px; height:3px; border-left:1.7px solid #fff;
  border-bottom:1.7px solid #fff; transform:rotate(-45deg) translateY(-1px) }
.frow .k{ margin-left:auto; font-family:var(--fm); font-size:9.5px; color:var(--faint) }
.frow.nil{ opacity:.35 }
#chips{ display:flex; flex-wrap:wrap; gap:5px; padding:8px var(--u2); background:var(--paper2);
  border-bottom:var(--hair) solid var(--line) }
.chip{ display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 9px;
  border-radius:999px; background:var(--blue); color:#fff; font-weight:600 }
.chip b{ opacity:.7; font-size:12px; line-height:1 }
#chips .zap{ font-size:11px; color:var(--dim); padding:3px 9px; border-radius:999px;
  border:var(--hair) solid var(--line2) }
#list{ flex:1; overflow-y:auto; overscroll-behavior:contain; padding-bottom:var(--u4) }
#list::-webkit-scrollbar{ width:9px }
#list::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:5px; border:3px solid transparent;
  background-clip:content-box }
.sect{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:7px; padding:7px var(--u2);
  font-family:var(--fm); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim);
  background:rgba(246,248,251,.96); backdrop-filter:blur(6px); border-bottom:var(--hair) solid var(--line) }
.sect .k{ margin-left:auto; color:var(--faint) }
.it{ position:relative; display:block; width:100%; text-align:left; padding:9px var(--u2) 9px 25px;
  border-bottom:var(--hair) solid var(--line); min-height:44px; transition:background .16s, padding-left .18s var(--ease) }
.it::before{ content:""; position:absolute; left:var(--u2); top:15px; width:4px; height:4px; border-radius:50%;
  background:var(--line2); transition:.18s }
.it:hover{ background:var(--paper2); padding-left:29px } .it:hover::before{ background:var(--blue-lo) }
.it.on{ background:linear-gradient(90deg,var(--blue-wash),transparent) }
.it.on::before{ left:0; top:0; bottom:0; width:3px; height:auto; border-radius:0 2px 2px 0;
  background:linear-gradient(180deg,var(--blue),var(--amber-lo)) }
.it.cur{ box-shadow:inset 0 0 0 2px var(--blue-lo) }
.it .id{ display:block; font-family:var(--fm); font-size:10.5px; font-weight:650; color:var(--blue-hi) }
.it .rv{ font-family:var(--fm); font-size:9px; color:var(--faint); margin-left:6px; font-weight:400 }
.it .tt{ display:block; font-size:12.5px; line-height:1.4; margin-top:1px }
.it.on .tt{ font-weight:600 }
.it .snip{ display:block; font-size:11px; color:var(--dim); line-height:1.45; margin-top:4px;
  border-left:2px solid var(--line2); padding-left:7px }
.it .snip mark{ background:#fdf0c8; border-radius:2px; padding:0 1px }
.it .bg{ display:flex; flex-wrap:wrap; gap:4px; margin-top:5px }
.bd{ font-family:var(--fm); font-size:8.5px; letter-spacing:.05em; text-transform:uppercase;
  padding:2px 6px; border-radius:4px; background:var(--paper3); color:var(--dim) }
.bd.k{ background:var(--blue-wash); color:var(--blue-hi) }
.bd.w{ background:var(--amber-wash); color:var(--amber) }
.bd.t{ background:var(--green-wash); color:var(--green) }
.it .pin{ position:absolute; right:8px; top:9px; width:24px; height:24px; display:grid; place-items:center;
  color:var(--line2); opacity:0; transition:.16s }
.it:hover .pin,.it .pin.on{ opacity:1 } .it .pin.on{ color:var(--amber-lo) }
.it .pin svg{ width:13px; height:13px }
#none{ padding:var(--u3) var(--u2); text-align:center; color:var(--faint); font-size:12.5px; line-height:1.6 }

/* ---------- workspace ---------- */
#work{ position:relative; display:flex; flex-direction:column; min-height:0; background:var(--bg) }
#whead{ flex:none; display:flex; align-items:center; gap:var(--u2); padding:10px var(--u3);
  background:var(--paper); border-bottom:var(--hair) solid var(--line) }
#wcrumb{ min-width:0; flex:1 }
#wcrumb .cr{ font-family:var(--fm); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block }
#wcrumb .ti{ font-size:var(--t2); font-weight:680; letter-spacing:-.01em; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; display:block; line-height:1.25 }
.wbtn{ display:flex; align-items:center; gap:6px; height:32px; padding:0 12px; flex:none;
  border:var(--hair) solid var(--line); border-radius:var(--r1); background:var(--paper);
  font-size:12px; font-weight:600; color:var(--ink2); box-shadow:var(--sh1); transition:.18s; white-space:nowrap }
.wbtn:hover{ border-color:var(--blue-lo); color:var(--blue-hi); box-shadow:0 0 0 3px var(--glow) }
.wbtn svg{ width:14px; height:14px }
.wbtn.p{ background:var(--blue); color:#fff; border-color:var(--blue) }
.wbtn.p:hover{ filter:brightness(1.07); color:#fff }
#feed{ flex:1; overflow-y:auto; overscroll-behavior:contain; padding:var(--u3) var(--u3) var(--u4);
  -webkit-overflow-scrolling:touch }
#feed::-webkit-scrollbar{ width:10px }
#feed::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:5px; border:3px solid transparent;
  background-clip:content-box }
#col{ max-width:none; display:flex; flex-direction:column; gap:var(--u2) }

/* welcome */
#hello{ max-width:74ch; margin:0 auto; padding:var(--u4) 0; display:flex; flex-direction:column; gap:var(--u3) }
#hello h1{ font-size:var(--t3); font-weight:700; letter-spacing:-.02em; text-align:center }
#hello .sub{ text-align:center; color:var(--dim); font-size:var(--t1); max-width:58ch; margin:0 auto }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px }
.card{ text-align:left; padding:13px 15px; border-radius:var(--r2); background:var(--paper);
  border:var(--hair) solid var(--line); box-shadow:var(--sh1); transition:.18s }
.card:hover{ border-color:var(--blue-lo); box-shadow:0 0 0 3px var(--glow); transform:translateY(-1px) }
.card b{ display:block; font-size:13px; font-weight:650; margin-bottom:3px }
.card span{ display:block; font-size:11.5px; color:var(--dim); line-height:1.5 }
.tips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center }
.tip{ font-size:11px; color:var(--dim); background:var(--paper); border:var(--hair) solid var(--line);
  border-radius:999px; padding:4px 11px }
.tip kbd{ font-family:var(--fm); font-size:10px; background:var(--paper3); border-radius:4px;
  padding:1px 5px; margin-right:4px }
.notice{ font-size:11.5px; color:var(--amber); background:var(--amber-wash);
  border:var(--hair) solid #f0e0b6; border-radius:var(--r1); padding:10px 13px; line-height:1.55 }

/* messages */
.m{ padding:var(--u2) var(--u3); font-size:var(--t1); line-height:1.7; border-radius:var(--r2);
  background:var(--paper); border:var(--hair) solid var(--line); box-shadow:var(--sh1);
  overflow-wrap:break-word; min-width:0; animation:rise .38s var(--ease) both }
@keyframes rise{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }
.m.u{ align-self:flex-end; max-width:84%; background:var(--blue); color:#fff; border-color:transparent;
  box-shadow:0 2px 10px rgba(18,102,212,.28); font-weight:500 }
.m.a{ position:relative; padding-left:calc(var(--u3) + 4px) }
.m.a::before{ content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px;
  border-radius:0 3px 3px 0; background:linear-gradient(180deg,var(--blue),var(--blue-lo) 50%,var(--amber-lo)) }
.m.e{ align-self:center; background:var(--red-wash); border-color:#eccdca; color:var(--red);
  display:flex; gap:var(--u2); align-items:center; box-shadow:none }
.m h1,.m h2,.m h3{ line-height:1.3; margin:var(--u3) 0 var(--u); font-weight:680; color:var(--blue-hi) }
.m h1:first-child,.m h2:first-child,.m h3:first-child{ margin-top:2px }
.m h1{ font-size:calc(var(--t2)*1.1) } .m h2{ font-size:var(--t2) } .m h3{ font-size:calc(var(--t1)*1.06) }
.m h2::after{ content:""; display:block; width:40px; height:1px; margin-top:6px;
  background:linear-gradient(90deg,var(--amber-lo),transparent) }
.m p{ margin:var(--u) 0 } .m ul,.m ol{ margin:var(--u) 0 var(--u) var(--u3) }
.m li{ margin:5px 0 } .m li::marker{ color:var(--blue-lo) }
.m code{ font-family:var(--fm); font-size:.87em; background:var(--paper3); padding:1px 5px;
  border-radius:4px; border:var(--hair) solid var(--line) }
.m pre{ background:var(--paper3); border:var(--hair) solid var(--line); border-radius:var(--r1);
  padding:var(--u2); overflow-x:auto; margin:var(--u) 0 }
.m pre code{ border:none; background:none; padding:0 }
.m blockquote{ border-left:3px solid var(--amber-lo); padding:var(--u) var(--u2); color:#6a5723;
  background:linear-gradient(90deg,var(--amber-wash),transparent); margin:var(--u2) 0;
  border-radius:0 var(--r1) var(--r1) 0 }
.m table{ border-collapse:collapse; width:100%; margin:var(--u2) 0; font-size:12.5px }
.m th,.m td{ border:var(--hair) solid var(--line); padding:7px 10px; text-align:left; vertical-align:top }
.m th{ background:var(--paper3); font-weight:650 }
.m a{ color:var(--blue); text-underline-offset:2px }
.m strong{ color:var(--blue-hi) }
.m hr{ border:none; height:1px; margin:var(--u2) 0;
  background:linear-gradient(90deg,transparent,var(--line2),transparent) }
.m .gl{ border-bottom:1px dotted var(--blue-lo); cursor:help }
.tool{ display:inline-flex; align-items:center; gap:8px; font-family:var(--fm); font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--blue-hi); background:var(--blue-wash);
  border-radius:var(--r1); padding:6px 11px; margin:5px 0 }
.dots{ display:inline-flex; gap:5px; align-items:center }
.dots i{ width:5px; height:5px; border-radius:50%; background:var(--blue); animation:bl 1.2s ease-in-out infinite }
.dots i:nth-child(2){ animation-delay:.16s; background:var(--blue-lo) }
.dots i:nth-child(3){ animation-delay:.32s; background:var(--amber-lo) }
@keyframes bl{ 0%,100%{ opacity:.25; transform:scale(.75) } 50%{ opacity:1; transform:scale(1.2) } }
.mfoot{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:11px; padding-top:10px;
  border-top:var(--hair) solid var(--line) }
.mfoot a,.mfoot button{ font-family:var(--fm); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  padding:4px 9px; border-radius:var(--r1); background:var(--paper2); color:var(--dim);
  text-decoration:none; border:var(--hair) solid var(--line); transition:.16s }
.mfoot a:hover,.mfoot button:hover{ color:var(--blue-hi); border-color:var(--blue-lo) }
.mfoot .ok{ background:var(--green-wash); color:var(--green); border-color:#bfe3d3 }
.mfoot .fb.on{ background:var(--blue-wash); color:var(--blue-hi); border-color:var(--blue-lo) }
.cites{ margin-top:9px; font-size:11.5px; color:var(--dim) }
.cites b{ font-family:var(--fm); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--faint); display:block; margin-bottom:5px }
.cites a{ display:block; padding:3px 0; color:var(--blue) }

/* prompts row */
#asks{ flex:none; display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
  border-top:var(--hair) solid var(--line) }
.ask{ position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 6px; min-height:38px; background:var(--paper); transition:background .18s; white-space:nowrap }
.ask b{ font-size:12.5px; font-weight:650; color:var(--blue-hi) }
.ask i{ font-style:normal; font-family:var(--fm); font-size:9px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--faint); overflow:hidden; text-overflow:ellipsis }
.ask::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--blue);
  transform:scaleX(0); transition:transform .3s var(--ease) }
.ask:hover{ background:var(--paper2) } .ask:hover::after{ transform:scaleX(1) }
.ask.on::after{ transform:scaleX(1); animation:sc 1.1s ease-in-out infinite }
@keyframes sc{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
@media (max-width:1440px){ .ask i{ display:none } }

/* composer */
#comp{ flex:none; padding:var(--u2) var(--u3) calc(var(--u2) + var(--safe-b)); background:var(--paper);
  border-top:var(--hair) solid var(--line) }
#files{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px }
.fchip{ display:inline-flex; align-items:center; gap:6px; border:var(--hair) solid var(--line);
  background:var(--paper2); border-radius:var(--r1); padding:4px 9px; font-size:11.5px; max-width:100% }
.fchip svg{ width:13px; height:13px; color:var(--blue); flex:none }
.fchip b{ font-weight:600; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.fchip i{ font-style:normal; font-family:var(--fm); font-size:9.5px; color:var(--faint) }
.fchip .x{ color:var(--faint); font-weight:700; padding:0 2px; min-width:18px; line-height:1 }
.fchip .x:hover{ color:var(--red) }
.fchip.bad{ border-color:#eccdca; background:var(--red-wash); color:var(--red) }
#crow{ display:flex; gap:7px; align-items:flex-end; background:var(--paper2);
  border:var(--hair) solid var(--line2); border-radius:var(--r2); padding:6px; transition:.18s }
#crow:focus-within{ border-color:var(--blue-lo); box-shadow:0 0 0 3px var(--glow); background:var(--paper) }
#in{ flex:1; min-width:0; min-height:30px; max-height:180px; resize:none; background:transparent;
  border:none; font-size:max(16px,var(--t1)); padding:5px 8px; line-height:1.5 }
#in:focus{ outline:none } #in::placeholder{ color:var(--faint) }
.ib{ width:31px; height:31px; flex:none; display:grid; place-items:center; color:var(--faint);
  border-radius:var(--r1); transition:.16s }
.ib:hover{ color:var(--blue); background:var(--paper3) }
.ib.rec{ color:#fff; background:linear-gradient(135deg,#e0443a,#b3261e); animation:rp 1.4s ease-in-out infinite }
@keyframes rp{ 0%,100%{ box-shadow:0 0 0 0 rgba(224,68,58,.45) } 50%{ box-shadow:0 0 0 7px rgba(224,68,58,0) } }
#drop{ position:absolute; inset:var(--u); z-index:40; display:grid; place-items:center;
  background:rgba(18,102,212,.07); backdrop-filter:blur(2px); border:2px dashed var(--blue-lo);
  border-radius:var(--r2) }
#drop div{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:var(--u3) var(--u4);
  background:rgba(255,255,255,.95); border-radius:var(--r2); box-shadow:var(--sh2); text-align:center }
#drop svg{ width:30px; height:30px; color:var(--blue) }
#drop b{ font-size:var(--t2) } #drop span{ font-size:12px; color:var(--dim) }

/* ---------- context panel ---------- */
#ctx{ display:flex; flex-direction:column; min-height:0; background:var(--paper);
  border-left:var(--hair) solid var(--line) }
#ctx header{ flex:none; display:flex; align-items:center; gap:var(--u); height:42px; padding:0 var(--u2);
  border-bottom:var(--hair) solid var(--line); background:var(--paper2) }
#ctx header b{ font-family:var(--fm); font-size:10.5px; font-weight:700; letter-spacing:.06em;
  color:var(--blue-hi); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
#ctxb{ flex:1; overflow-y:auto; padding:var(--u2) }
#ctxb h4{ font-family:var(--fm); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--faint); margin:var(--u2) 0 7px; padding-top:var(--u2); border-top:var(--hair) solid var(--line) }
#ctxb h4:first-child{ margin-top:0; padding-top:0; border-top:none }
.kv{ display:flex; gap:9px; font-size:12px; padding:3px 0 }
.kv span:first-child{ color:var(--faint); min-width:76px; flex:none }
.ax{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; font-size:12px;
  padding:7px 9px; border-radius:var(--r1); border:var(--hair) solid var(--line); background:var(--paper2);
  margin-bottom:5px; transition:.16s }
.ax:hover{ border-color:var(--blue-lo); background:var(--paper); color:var(--blue-hi); box-shadow:0 0 0 3px var(--glow) }
.ax svg{ width:14px; height:14px; flex:none; color:var(--blue) }
.tg{ display:inline-block; font-size:10.5px; padding:3px 9px; margin:0 4px 4px 0; border-radius:999px;
  background:var(--paper3); color:var(--dim); transition:.16s }
.tg:hover{ background:var(--blue-wash); color:var(--blue-hi) }
.sc{ display:block; width:100%; text-align:left; font-size:11.5px; padding:4px 6px; border-radius:var(--r1);
  line-height:1.4; transition:.16s }
.sc:hover{ background:var(--paper2); color:var(--blue-hi) }
.sc i{ font-style:normal; font-family:var(--fm); font-size:9.5px; color:var(--faint); float:right }
.rf{ display:inline-block; font-family:var(--fm); font-size:10.5px; padding:3px 8px; margin:0 4px 4px 0;
  border-radius:var(--r1); background:var(--paper3); color:var(--blue-hi); font-weight:600; transition:.16s }
.rf:hover{ background:var(--blue-wash) }
.rl{ display:block; width:100%; text-align:left; padding:6px 8px; border-radius:var(--r1); font-size:11.5px;
  line-height:1.35; transition:.16s }
.rl b{ display:block; font-family:var(--fm); font-size:10px; color:var(--blue-hi) }
.rl:hover{ background:var(--paper2) }
.auth{ font-family:var(--fm); font-size:10.5px; color:var(--dim); line-height:1.9 }
.mute{ font-size:11.5px; color:var(--faint); line-height:1.55 }

/* ---------- modal (palette / role / glossary / compare) ---------- */
.ov{ position:fixed; inset:0; z-index:80; background:rgba(11,37,69,.42); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; padding:10vh var(--u2) 0;
  animation:fade .16s var(--ease2) both }
@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
.box{ width:min(660px,100%); background:var(--paper); border-radius:var(--r3); overflow:hidden;
  box-shadow:var(--sh3); animation:pop .22s var(--ease) both; max-height:78vh; display:flex; flex-direction:column }
@keyframes pop{ from{ transform:translateY(-10px); opacity:0 } to{ transform:none; opacity:1 } }
.box input.q{ width:100%; border:none; padding:16px 18px; font-size:16px; border-bottom:var(--hair) solid var(--line) }
.box input.q:focus{ outline:none }
.box .body{ overflow-y:auto; padding:7px }
.box .hint{ display:flex; gap:14px; padding:8px 16px; border-top:var(--hair) solid var(--line);
  background:var(--paper2); font-size:10.5px; color:var(--faint) }
.box .hint kbd{ font-family:var(--fm); font-size:9.5px; background:var(--paper3);
  border:var(--hair) solid var(--line2); border-radius:4px; padding:1px 5px; margin-right:3px }
.row{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 12px;
  border-radius:var(--r1); font-size:13px }
.row .rid{ font-family:var(--fm); font-size:11px; font-weight:700; color:var(--blue-hi);
  min-width:112px; flex:none }
.row .rtx{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 }
.row .rk{ margin-left:auto; font-family:var(--fm); font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint); flex:none }
.row.sel{ background:var(--blue-wash) }
.box h3{ padding:14px 18px 4px; font-size:15px; font-weight:700 }
.box p.lead{ padding:0 18px 12px; font-size:12.5px; color:var(--dim); line-height:1.6 }
.roles{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 14px 14px }
.role{ text-align:left; padding:12px 14px; border-radius:var(--r2); border:var(--hair) solid var(--line);
  background:var(--paper2); transition:.16s }
.role:hover{ border-color:var(--blue-lo); background:var(--paper); box-shadow:0 0 0 3px var(--glow) }
.role.on{ border-color:var(--blue); background:var(--blue-wash) }
.role b{ display:block; font-size:13px; font-weight:650; margin-bottom:3px }
.role span{ display:block; font-size:11.5px; color:var(--dim); line-height:1.5 }
.gl-list dt{ font-family:var(--fm); font-size:12px; font-weight:700; color:var(--blue-hi); margin-top:11px }
.gl-list dd{ font-size:12.5px; color:var(--ink2); line-height:1.55; margin-left:0 }
#tip{ position:fixed; z-index:90; max-width:280px; background:var(--navy); color:#e6eefb;
  font-size:11.5px; line-height:1.5; padding:8px 11px; border-radius:8px; box-shadow:var(--sh2);
  pointer-events:none }
#tip b{ display:block; font-family:var(--fm); font-size:10px; color:var(--blue-lo); margin-bottom:2px }
#toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:95;
  background:var(--navy); color:#fff; font-size:12.5px; padding:9px 16px; border-radius:999px;
  box-shadow:var(--sh2); animation:tin .25s var(--ease) both }
@keyframes tin{ from{ opacity:0; transform:translate(-50%,10px) } to{ opacity:1; transform:translateX(-50%) } }

/* ---------- responsive ---------- */
@media (max-width:1100px){
  #app{ grid-template-columns:minmax(0,1fr) }
  body.ctx #app{ grid-template-columns:minmax(0,1fr) }
  #index{ position:fixed; z-index:50; top:calc(var(--top-h) + var(--sub-h) + var(--safe-t)); bottom:0; left:0;
    width:min(88vw,360px); transform:translateX(-102%); transition:transform .3s var(--ease);
    box-shadow:var(--sh3) }
  body.idx #index{ transform:none }
  #work{ grid-column:1 }
  #ctx{ position:fixed; z-index:50; top:calc(var(--top-h) + var(--sub-h) + var(--safe-t)); bottom:0; right:0;
    width:min(92vw,380px); box-shadow:var(--sh3) }
  #menu{ display:flex !important }
  #scrim{ position:fixed; inset:0; z-index:45; background:rgba(11,37,69,.36) }
}
@media (min-width:1101px){ #menu{ display:none } #scrim{ display:none } }
@media (max-width:720px){
  :root{ --top-h:48px }
  #brand em{ display:none }
  #gsearch span{ display:none } #gsearch{ flex:none; width:40px; padding:0; justify-content:center }
  #gsearch kbd{ display:none }
  .tbtn span{ display:none } .tbtn{ padding:0 9px }
  #feed{ padding:var(--u2) }
  #comp{ padding:var(--u2) var(--u2) calc(var(--u2) + var(--safe-b)) }
  .m{ padding:var(--u2) } .m.a{ padding-left:calc(var(--u2) + 4px) }
  .roles{ grid-template-columns:1fr }
  #whead{ padding:9px var(--u2) }
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation:none !important; transition:none !important } }

/* ---------- print ---------- */
@media print{
  @page{ margin:18mm }
  html,body{ height:auto; overflow:visible; background:#fff }
  #app{ position:static; display:block; height:auto }
  #topbar,#subbar,#index,#ctx,#asks,#comp,#scrim,.mfoot button,.ib,#drop{ display:none !important }
  #work{ display:block } #feed{ overflow:visible; padding:0 }
  #whead{ border:none; padding:0 0 8mm }
  #wcrumb .ti{ font-size:17pt; white-space:normal }
  .m{ break-inside:avoid; box-shadow:none; border:none; border-left:2pt solid #999; border-radius:0;
    padding:0 0 0 8pt; margin:0 0 6mm; font-size:10.5pt; line-height:1.5; max-width:none !important;
    background:none !important; color:#000 !important }
  .m.u{ font-weight:700; border-left-color:#1266d4 }
  .m h1,.m h2,.m h3{ color:#000 }
  .m a{ color:#000; text-decoration:underline }
  .m a::after{ content:" (" attr(href) ")"; font-size:8pt; color:#555 }
  #printfoot{ display:block !important; margin-top:10mm; padding-top:4mm; border-top:1pt solid #999;
    font-size:8.5pt; color:#333; line-height:1.5 }
}
#printfoot{ display:none }
</style>
</head>

<div id="app">

  <header id="topbar">

      <b>VIIM</b><em>VDOT guidance</em>

  <nav id="subbar" aria-label="Divisions"></nav>

      <span id="n">0</span>
    </div>

      </button>
      <button class="wbtn" id="new-btn" title="New thread">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3.5v9M3.5 8h9"/></svg>

        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3h12v12H3z"/><path d="M6 6.5h6M6 9h6M6 11.5h4"/></svg>

<script>
'use strict';
/* ============================================================
   VIIM v4
   1 roles · 2 state & storage · 3 manifest · 4 index & facets
   5 workspace · 6 streaming · 7 markdown · 8 uploads
   9 palette · 10 glossary · 11 compare · 12 export/print · 13 keys
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const slugOf=id=>String(id).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 1. Roles ---------- */
const ROLES={
  locality:{ name:'Locality staff', blurb:'City, town or county staff delivering a locally administered project.',
    div:'lad', facets:{delivery:['locally administered']},
    sys:'The user is LOCALITY STAFF administering a project with VDOT oversight. Lead with the locality’s obligations, VDOT review and approval points, agreement and invoicing mechanics, and where the LAP Manual governs. Name the District contact point when approval is involved.',
    asks:[['Summarize','what it requires'],['My obligations','locality duties'],['VDOT approvals','who signs off'],['Related','cross-references']] },
  consultant:{ name:'Consultant', blurb:'Designer or engineer preparing plans and submittals for VDOT.',
    div:null, facets:{},
    sys:'The user is a CONSULTANT ENGINEER preparing plans or submittals. Lead with the design requirement itself — criteria, dimensions, thresholds, plan-sheet and submittal expectations — then exceptions and the deviation path. Be precise about which manual or standard controls.',
    asks:[['Summarize','what it requires'],['Design criteria','thresholds'],['Plan requirements','submittal'],['Related','cross-references']] },
  contractor:{ name:'Contractor / Inspector', blurb:'Building it, inspecting it, documenting it.',
    div:'con', facets:{phase:['construction']},
    sys:'The user is a CONTRACTOR or CONSTRUCTION INSPECTOR. Lead with what must happen in the field: specification references, materials sampling and testing, documentation and pay items, work-zone requirements, and change-order or claim mechanics. Cite the specification section number wherever one applies.',

    asks:[['Summarize','what it requires'],['What triggers it','applicability'],['Submittal path','how to apply'],['Related','cross-references']] },

/* ---------- 2. State & storage ---------- */
const LS='viim.v4';
const S={ man:null, idx:null, doc:null, div:null, role:'consultant', busy:false, ctrl:null,
  proxy:false, fast:false, threads:{}, pins:[], recents:[], cur:-1 };
const F={ topic:new Set(), phase:new Set(), delivery:new Set(), district:new Set(), kind:new Set() };
let FTAB='all';
const CORPUS=new Map(), UPLOADS=new Map(), ANSWERS=new Map();

function save(){
  try{ localStorage.setItem(LS, JSON.stringify({
    role:S.role, div:S.div, docId:S.doc?S.doc.id:null, pins:S.pins, recents:S.recents.slice(0,20),
    facets:Object.fromEntries(Object.entries(F).map(([k,v])=>[k,[...v]])),
    threads:Object.fromEntries(Object.entries(S.threads).map(([k,v])=>[k,v.slice(-24)])),
  })); }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(LS)||'{}');
    if(d.role && ROLES[d.role]) S.role=d.role;
    S.pins=d.pins||[]; S.recents=d.recents||[]; S.threads=d.threads||{};
    if(d.facets) Object.entries(d.facets).forEach(([k,v])=>{ if(F[k]) v.forEach(x=>F[k].add(x)); });
    return d;
  }catch(e){ return {}; }
}
const threadKey=()=>S.doc?S.doc.id:(S.div?('div:'+S.div):'all');
function thread(){ const k=threadKey(); if(!S.threads[k]) S.threads[k]=[]; return S.threads[k]; }

function toast(msg){
  const t=document.createElement('div'); t.id='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}

/* ---------- 3. Manifest ---------- */
async function boot(){
  const saved=load();
  try{
    const r=await fetch('data/manifest.json',{cache:'no-cache'});
    S.man=await r.json();
  }catch(e){ S.man={divisions:[],documents:[],facets:{}}; }
  S.man.documents.forEach(d=>{ d.district=d.district||['Statewide']; });
  fetch('data/search-index.json',{cache:'force-cache'}).then(r=>r.ok?r.json():null)
    .then(j=>{ S.idx=j; }).catch(()=>{});
  fetch('data/glossary.json',{cache:'force-cache'}).then(r=>r.ok?r.json():null)
    .then(j=>{ GLOSSARY=j||{}; }).catch(()=>{});

  setRole(S.role, true);
  buildDivs();
  const fromHash=readHash();
  if(!fromHash){
    if(saved.div) S.div=saved.div;
    const d=saved.docId ? S.man.documents.find(x=>x.id===saved.docId) : null;
    setDiv(S.div, true); if(d) selectDoc(d, true);
  }
  renderFacets(); renderChips(); renderList(); paintWork();
  probe();
}
async function probe(){
  if(location.protocol==='file:') return;
  try{ const r=await fetch('api/chat',{method:'GET'}); S.proxy=(r.status===405); }catch(e){ S.proxy=false; }
}

/* ---------- 4. Divisions, facets, index ---------- */
function divCounts(){
  const c={}; (S.man.documents||[]).forEach(d=>{ c[d.div]=(c[d.div]||0)+1; }); return c;
}
function buildDivs(){
  const bar=$('#subbar'), c=divCounts(); bar.innerHTML='';
  const all=document.createElement('button');
  all.className='dv'+(S.div?'':' on'); all.dataset.div='';
  all.innerHTML='All <span class="c">'+(S.man.documents||[]).length+'</span>';
  all.addEventListener('click',()=>setDiv(null));
  bar.appendChild(all);
  (S.man.divisions||[]).filter(d=>c[d.id]).forEach(d=>{
    const b=document.createElement('button');
    b.className='dv'+(S.div===d.id?' on':'')+(d.id==='mine'?' mine':'');
    b.dataset.div=d.id; b.title=d.label;
    b.innerHTML=esc(d.code)+' <span class="c">'+c[d.id]+'</span>';
    b.addEventListener('click',()=>setDiv(d.id));
    bar.appendChild(b);
  });
}
function setDiv(id, quiet){
  S.div=id||null;
  $$('.dv').forEach(b=>b.classList.toggle('on',(b.dataset.div||'')===(S.div||'')));
  if(!quiet){ S.doc=null; renderFacets(); renderChips(); renderList(); paintWork(); save(); writeHash(); }
}
function pool(){ return (S.man.documents||[]).filter(d=>!S.div||d.div===S.div); }
function passes(d){
  for(const f of Object.keys(F)){
    if(!F[f].size) continue;
    const v=d[f]?(Array.isArray(d[f])?d[f]:[d[f]]):[];
    if(![...F[f]].some(x=>v.includes(x))) return false;
  }
  return true;
}
function renderFacets(){
  const box=$('#fpanel');
  if(FTAB==='all'){ box.hidden=true; return; }
  box.hidden=false;
  const counts=new Map();
  pool().forEach(d=>(d[FTAB]||[]).forEach(v=>counts.set(v,(counts.get(v)||0)+1)));
  const opts=(S.man.facets&&S.man.facets[FTAB])||[...counts.keys()].sort();
  box.innerHTML='';
  opts.forEach(v=>{
    const n=counts.get(v)||0;
    const b=document.createElement('button');
    b.className='frow'+(F[FTAB].has(v)?' on':'')+(n?'':' nil');
    b.innerHTML='<span class="bx"></span><span>'+esc(v)+'</span><span class="k">'+n+'</span>';
    b.addEventListener('click',()=>{ F[FTAB].has(v)?F[FTAB].delete(v):F[FTAB].add(v);
      renderFacets(); renderChips(); renderList(); save(); });
    box.appendChild(b);
  });
}
function renderChips(){
  const box=$('#chips'), on=[];
  Object.keys(F).forEach(f=>F[f].forEach(v=>on.push([f,v])));
  if(!on.length){ box.hidden=true; return; }
  box.hidden=false; box.innerHTML='';
  on.forEach(([f,v])=>{
    const c=document.createElement('button'); c.className='chip';
    c.innerHTML=esc(v)+' <b>×</b>';
    c.addEventListener('click',()=>{ F[f].delete(v); renderFacets(); renderChips(); renderList(); save(); });
    box.appendChild(c);
  });
  const z=document.createElement('button'); z.className='zap'; z.textContent='Clear';
  z.addEventListener('click',()=>{ Object.keys(F).forEach(f=>F[f].clear());
    renderFacets(); renderChips(); renderList(); save(); });
  box.appendChild(z);
}
function score(q){
  if(!S.idx||!q) return null;
  const terms=q.toLowerCase().split(/\s+/).filter(t=>t.length>1);
  if(!terms.length) return null;
  const N=S.idx.docs.length, sc=new Map();
  terms.forEach(t=>{
    const keys=S.idx.terms[t]?[t]:Object.keys(S.idx.terms).filter(k=>k.startsWith(t)).slice(0,40);
    keys.forEach(k=>{
      const posts=S.idx.terms[k]; if(!posts) return;
      const idf=Math.log(1+N/posts.length);
      posts.forEach(([di,tf])=>sc.set(di,(sc.get(di)||0)+idf*(1+Math.log(tf))*(k===t?1:.6)));
    });
  });
  const out=new Map(); sc.forEach((v,di)=>out.set(S.idx.docs[di],v)); return out;
}
function snippet(id,q){
  const b=CORPUS.get(id); if(!b||!b.text) return '';
  const terms=q.toLowerCase().split(/\s+/).filter(t=>t.length>2);
  const low=b.text.toLowerCase(); let at=-1;
  for(const t of terms){ at=low.indexOf(t); if(at>=0) break; }
  if(at<0) return '';
  const s=Math.max(0,at-70), frag=b.text.slice(s,s+180).replace(/\s+/g,' ').trim();
  return esc(frag).replace(new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig'),'<mark>$1</mark>');
}
function results(){
  const q=($('#q').value||'').trim(), sc=q?score(q):null;
  let list=pool().filter(d=>{
    if(!passes(d)) return false;
    if(!q) return true;
    const meta=(d.id+' '+d.title+' '+(d.note||'')+' '+(d.topic||[]).join(' ')).toLowerCase();
    return meta.includes(q.toLowerCase()) || (sc&&sc.has(d.id));
  });
  if(q&&sc){
    list.forEach(d=>{ d._s=(sc.get(d.id)||0)+((d.id+' '+d.title).toLowerCase().includes(q.toLowerCase())?6:0); });
    list.sort((a,b)=>(b._s||0)-(a._s||0));
  }
  return list;
}
function renderList(){
  const q=($('#q').value||'').trim(), wrap=$('#list'), list=results();
  $('#n').textContent=list.length;
  wrap.innerHTML='';
  if(!list.length){
    wrap.innerHTML='<div id="none">Nothing matches.<br>Clear filters, or run <code>tools/build-manifest.py</code> for the full VDOT index.</div>';
    return;
  }
  const pins=list.filter(d=>S.pins.includes(d.id));
  const rest=list.filter(d=>!S.pins.includes(d.id));
  if(pins.length && !q){ wrap.appendChild(sectionRow('Pinned',pins.length)); pins.forEach(d=>wrap.appendChild(itemRow(d,q))); }
  if(pins.length && !q) wrap.appendChild(sectionRow(S.div?'In this division':'All documents',rest.length));
  rest.forEach(d=>wrap.appendChild(itemRow(d,q)));
}
function sectionRow(label,count){
  const s=document.createElement('div'); s.className='sect';
  s.innerHTML=esc(label)+'<span class="k">'+count+'</span>'; return s;
}
function itemRow(d,q){
  const b=document.createElement('button');
  b.className='it'+(S.doc&&S.doc.id===d.id?' on':'');
  b.dataset.id=d.id;
  const badges=[];
  if(d.mine) badges.push('<span class="bd t">yours</span>');
  else if(d.text) badges.push('<span class="bd t">full text</span>');
  if(d.kind&&d.kind!=='IIM') badges.push('<span class="bd k">'+esc(d.kind)+'</span>');
  if(d.status&&!['current','uploaded'].includes(d.status)) badges.push('<span class="bd w">'+esc(d.status)+'</span>');
  (d.topic||[]).slice(0,2).forEach(t=>badges.push('<span class="bd">'+esc(t)+'</span>'));
  const sn=q?snippet(d.id,q):'';
  b.innerHTML='<span class="id">'+esc(d.id)+
    (d.revision?'<span class="rv">rev '+esc(d.revision)+'</span>':'')+
    (d.effective?'<span class="rv">'+esc(d.effective)+'</span>':'')+'</span>'+
    '<span class="tt">'+esc(d.title)+'</span>'+
    (sn?'<span class="snip">'+sn+'</span>':'')+
    (badges.length?'<span class="bg">'+badges.join('')+'</span>':'');
  const pin=document.createElement('button');
  pin.className='pin'+(S.pins.includes(d.id)?' on':''); pin.setAttribute('aria-label','Pin');
  pin.innerHTML='<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.3l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>';
  pin.addEventListener('click',e=>{ e.stopPropagation();
    S.pins.includes(d.id)?S.pins=S.pins.filter(x=>x!==d.id):S.pins.push(d.id);
    save(); renderList(); });
  b.appendChild(pin);
  return b;
}
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('.it'); if(!b) return;
  const d=(S.man.documents||[]).find(x=>x.id===b.dataset.id);
  selectDoc(S.doc&&S.doc.id===b.dataset.id?null:d);
});
$('#q').addEventListener('input',renderList);
$$('.ftab').forEach(t=>t.addEventListener('click',()=>{
  FTAB=(FTAB===t.dataset.f&&t.dataset.f!=='all')?'all':t.dataset.f;

}));

/* ---------- 5. Workspace ---------- */
const feed=$('#feed'), col=$('#col'), input=$('#in');
function paintWork(){
  const d=S.doc, dv=d?(S.man.divisions||[]).find(x=>x.id===d.div)
                   :(S.div?(S.man.divisions||[]).find(x=>x.id===S.div):null);
  $('#crumb').textContent = d ? (dv?dv.label+'  ›  ':'')+d.id+(d.revision?'  ›  rev '+d.revision:'')
                              : (dv?dv.label:'All divisions');

  if(d&&d.url&&!d.mine){ link.hidden=false; link.href=d.url; } else link.hidden=true;
  input.placeholder = d ? 'Ask about '+d.id+'…' : 'Ask about VDOT guidance…';
  buildAsks(); render();
  if(!$('#ctx').hidden) renderCtx();

function selectDoc(d, quiet){
  S.doc=d||null; S.cur=-1;
  if(d){
    S.recents=[d.id,...S.recents.filter(x=>x!==d.id)].slice(0,20);
    if(!d.mine) loadCorpus(d.id).then(()=>{ renderList(); if(!$('#ctx').hidden) renderCtx(); });
  }
  renderList(); paintWork();
  if(!quiet){ save(); writeHash(); }
  if(innerWidth<=1100) document.body.classList.remove('idx');
}
async function loadCorpus(id){
  if(CORPUS.has(id)) return CORPUS.get(id);
  try{
    const r=await fetch('data/corpus/'+slugOf(id)+'.json',{cache:'force-cache'});
    if(!r.ok) throw 0;
    const b=await r.json(); CORPUS.set(id,b); return b;
  }catch(e){ CORPUS.set(id,null); return null; }
}
function buildAsks(){
  const box=$('#asks'), role=ROLES[S.role];
  const mine=S.doc&&S.doc.mine;
  const labels = mine
    ? [['Summarize','this document'],['Which guidance','applies here'],['Review','compliance check'],['Extract','commitments']]
    : role.asks;
  box.innerHTML='';
  labels.forEach((l,i)=>{
    const b=document.createElement('button'); b.className='ask'; b.dataset.i=i;
    b.innerHTML='<b>'+esc(l[0])+'</b><i>'+esc(l[1])+'</i>';
    b.addEventListener('click',()=>runAsk(i,b));
    box.appendChild(b);
  });
}
function askText(i){
  const d=S.doc, role=S.role;
  if(d&&d.mine) return [
    'Summarize this document: what it is, what it covers, and the key figures, dates and commitments.',
    'Which VDOT guidance governs this document? Name the IIMs, manuals and regulations by number and say why each applies.',
    'Review this document against the governing VDOT requirements. List what is missing, inconsistent or likely to draw a review comment, citing both the document and the VDOT section.',
    'Extract every commitment, deadline, quantity and responsible party from this document as a table.'][i];
  const t=d?d.id:(S.div?((S.man.divisions||[]).find(x=>x.id===S.div)||{}).label+' guidance':'VDOT guidance');
  const byRole={
    locality:['Summarize '+t+'. Lead with the operative requirements, then conditions and exceptions. Cite revision and sections.',
      'What exactly is the locality responsible for under '+t+'? Separate what we do, what VDOT does, and what needs an agreement.',
      'Where does VDOT review or approve under '+t+'? Name the approval, who holds it, and what triggers it.',
      'What other VDOT documents does '+t+' depend on or reference? Note anything superseded.'],
    consultant:['Summarize '+t+'. Lead with the operative requirements, then conditions and exceptions. Cite revision and sections.',
      'What are the design criteria and thresholds in '+t+'? Give numbers in a table where possible.',
      'What does '+t+' require on the plans and in the submittal? Sheet by sheet if it says so.',
      'What other VDOT documents does '+t+' reference or depend on? Note anything superseded.'],
    contractor:['Summarize '+t+'. Lead with what must happen in the field, citing specification sections.',
      'What are the field steps and hold points under '+t+'? Who inspects and when?',
      'What documentation, testing and records does '+t+' require during construction?',
      'What other specifications and standards does '+t+' tie to? Note anything superseded.'],
    developer:['Summarize '+t+' from a permit applicant’s point of view.',
      'What triggers '+t+' — which projects, entrances or streets fall under it, and what is exempt?',
      'What is the submittal and review path under '+t+'? What do I file, with whom, and in what order?',
      'What related regulations and standards apply alongside '+t+'?'],
    vdot:['Summarize '+t+'. Lead with the operative requirements and cite revision and sections.',
      'Who holds approval authority under '+t+', and what is delegated to the District?',
      'What is the internal process under '+t+' — steps, owners and documentation?',
      'What other guidance does '+t+' reference, supersede or depend on?'],
    newcomer:['Explain '+t+' in plain language. What is it for, and who needs it?',
      'Why does '+t+' exist? What problem is it solving, and what happens without it?',
      'Where does '+t+' fit among VDOT’s manuals, standards and specifications? What should I read next?',

  };
  return (byRole[role]||byRole.consultant)[i];
}
let askBusy=false;
function runAsk(i,b){
  if(S.busy||askBusy) return;
  askBusy=true; b.classList.add('on');
  S.fast=!(S.doc&&CORPUS.get(S.doc.id));

}
function render(){
  const h=thread();

}
function hello(){

      : 'Working as <b>'+esc(role.name)+'</b>. '+esc(role.blurb)+' Pick a document on the left, or just ask.')+'</p>';

    '<span class="tip"><kbd>/</kbd>filter index</span>'+
    '<span class="tip"><kbd>J</kbd><kbd>K</kbd>move through list</span>'+
    '<span class="tip">drag a PDF in to review it</span>';
  w.appendChild(tips);
  const n=document.createElement('div'); n.className='notice';

  w.appendChild(n);

}
function askOf(t,d){
  if(/^Summarize/.test(t)) return askText(0);
  if(/changed/.test(t)) return 'Check whether '+d.id+' has been revised. Fetch the current VDOT page, report the revision and effective date you find, and compare against '+(d.revision||'the value on file')+'.';
  if(/mistakes/.test(t)) return 'What do practitioners most often get wrong or miss when applying '+d.id+'? Be specific and cite sections.';
  return 'Explain '+d.id+' in plain language, defining every acronym on first use.';
}
function addMsg(cls,text,cites){
  const h=$('#hello'); h&&h.remove();
  const el=document.createElement('div'); el.className='m '+cls;
  if(cls==='a'){ el.innerHTML=glossify(md(text)); if(text) foot(el,text,cites); }
  else el.textContent=text;
  col.appendChild(el); feed.scrollTop=feed.scrollHeight;
  return el;
}
function foot(el,text,cites){
  const f=document.createElement('div'); f.className='mfoot';
  const mk=(label,fn,cls)=>{ const b=document.createElement('button'); b.textContent=label;
    if(cls) b.className=cls; b.addEventListener('click',()=>fn(b)); f.appendChild(b); return b; };
  mk('Copy',b=>{ navigator.clipboard&&navigator.clipboard.writeText(text);
    b.textContent='Copied'; setTimeout(()=>b.textContent='Copy',1200); });
  if(S.doc&&S.doc.url&&!S.doc.mine){
    const a=document.createElement('a'); a.href=S.doc.url; a.target='_blank'; a.rel='noopener noreferrer';
    a.textContent='Verify on VDOT ↗'; f.appendChild(a);
  }
  if(S.doc&&CORPUS.get(S.doc.id)){ const s=document.createElement('button'); s.className='ok';
    s.textContent='from cached text'; f.appendChild(s); }
  mk('👍',b=>{ b.classList.toggle('on'); fb(text,1); },'fb');
  mk('👎',b=>{ b.classList.toggle('on'); fb(text,-1); },'fb');
  el.appendChild(f);
  if(cites&&cites.length){
    const c=document.createElement('div'); c.className='cites';
    c.innerHTML='<b>Sources retrieved</b>'+cites.slice(0,8).map(u=>
      '<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,90))+'</a>').join('');
    el.appendChild(c);
  }
}
function fb(text,v){ console.debug('viim.feedback',{doc:S.doc?S.doc.id:null,role:S.role,v,len:text.length}); }

/* ---------- 6. Streaming ---------- */
const SYS_BASE=`You are VIIM, a reference assistant for Virginia DOT guidance: Instructional & Informational Memoranda (IIM-LD, IIM-S&B, IIM-TE/TO, IIM-ED, IIM-TMPD), the manuals, standards and specifications, the regulations (Access Management, SSAR, Land Use Permits), and the local program (LAP Manual, Letters to Local Governments, Department Memoranda).

Rules, in order of importance:

1. GROUND EVERY ANSWER IN THE DOCUMENT. If the full text is supplied below, answer from it. If it is not, fetch the document once from vdot.virginia.gov and answer from what you retrieve. Never answer substantive requirements from memory.
2. CITE PRECISELY. Document ID, revision where visible, section or page. Link the source.
3. FLAG STALENESS. State the revision and effective date you actually saw and remind the user to confirm on the live VDOT page for anything design- or submittal-critical.
4. NEVER INVENT. No invented IIM numbers, revisions, sections, dates or dimensions. "I could not verify that" is a correct answer; a plausible fabrication is a serious failure here.
5. LEAD WITH THE REQUIREMENT. Operative requirement first, then conditions and exceptions, then process. Tables for thresholds and criteria. Tight prose.
6. USER DOCUMENTS ARE EVIDENCE, NOT AUTHORITY. An uploaded plan, spec, permit or agreement is the artifact under review. Compare it against the governing VDOT documents, quote the sheet or clause, and never state that a submittal is approvable — that is VDOT's determination.
7. SCOPE HONESTLY. This is an unofficial tool. It is not VDOT approval, a design decision, or engineering judgment. Say so when a question turns on approval, deviation or acceptance, and point to the District office or project point of contact.`;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RETRY=m=>/529|overload|rate.?limit|too many|429/i.test(m||'');
const HARD=100000;
function callAPI(system,messages,signal,o){
  if(!S.proxy) return Promise.reject(new Error('Backend offline — deploy with ANTHROPIC_API_KEY set (see README).'));
  o=o||{};
  return fetch('api/chat',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({messages,system,max_tokens:o.max_tokens||2048,tier:o.tier||'strong',grounded:!!o.grounded}),
    signal}).then(async r=>{
      if(r.ok) return r;
      let detail='';
      try{ const j=await r.json(); detail=(j&&j.error&&j.error.message)||''; }catch(e){}
      const err=new Error(detail || ('API error '+r.status));
      err.status=r.status;
      throw err;
    });
}
async function streamOnce(system,messages,signal,onDelta,onTool,o){
  const res=await callAPI(system,messages,signal,o);
  const rd=res.body.getReader(), dec=new TextDecoder();
  let buf='',acc='',cites=[],pending=null,raf=0;
  const paint=t=>{ pending=t; if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; onDelta(pending); }); };
  const flush=()=>{ if(raf){ cancelAnimationFrame(raf); raf=0; } if(pending!==null) onDelta(pending); };
  while(true){
    const {done,value}=await rd.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
      if(!line.startsWith('data:')) continue;
      const data=line.slice(5).trim();
      if(!data||data==='[DONE]') continue;
      let j; try{ j=JSON.parse(data); }catch(e){ continue; }
      if(j.type==='content_block_start'&&j.content_block){
        const t=j.content_block.type;
        if(t==='server_tool_use'||t==='web_fetch_tool_result'||t==='web_search_tool_result') onTool&&onTool(t);
        const c=j.content_block.content;
        if(c&&c.url&&!cites.includes(c.url)) cites.push(c.url);
      }
      if(j.type==='content_block_delta'&&j.delta){
        if(j.delta.text){ acc+=j.delta.text; paint(acc); }
        if(j.delta.citation&&j.delta.citation.url&&!cites.includes(j.delta.citation.url))
          cites.push(j.delta.citation.url);
      }
      if(j.type==='error') throw new Error((j.error&&j.error.message)||'stream error');
    }
  }
  flush();
  if(!acc){ const e=new Error('Empty response'); e.empty=true; throw e; }
  return {text:acc,cites};
}
async function withRetry(system,messages,signal,onDelta,onWait,onTool,o){
  for(let a=0;;a++){
    try{ return await streamOnce(system,messages,signal,onDelta,onTool,o); }
    catch(err){
      const ok=RETRY(err.message)||err.empty;
      if(err.name==='AbortError'||a>=2||!ok) throw err;
      onWait&&onWait(a+1);
      await sleep(600*Math.pow(2,a)+Math.random()*300);
      if(signal.aborted){ const e=new Error('aborted'); e.name='AbortError'; throw e; }
    }
  }
}
function context(){
  const role=ROLES[S.role];
  let c='\n\nAUDIENCE\n'+role.sys+'\n';
  const d=S.doc;
  if(!d) return c + (S.div?('\nScope: browsing the '+((S.man.divisions||[]).find(x=>x.id===S.div)||{}).label+' division.\n'):'');
  if(d.mine){
    const rec=UPLOADS.get(d.id);
    return c+'\n\nSELECTED — UPLOADED BY THE USER\n- File: '+d.title+(rec?' ('+rec.kind+')':'')+
      '\nThe file is attached in the conversation. It is the artifact under review, not VDOT guidance. '+
      'Cite sheet/section/page from it and compare against the governing VDOT documents.\n';
  }
  const b=CORPUS.get(d.id);
  c+='\n\nSELECTED DOCUMENT\n- ID: '+d.id+'\n- Title: '+d.title+'\n- Type: '+(d.kind||'IIM')+'\n'+
    (d.revision?'- Revision on file: '+d.revision+'\n':'')+
    (d.effective?'- Effective date on file: '+d.effective+'\n':'')+
    (d.status&&d.status!=='current'?'- Status: '+d.status+'\n':'')+
    (d.supersedes?'- Supersedes: '+d.supersedes.join(', ')+'\n':'')+
    (d.superseded_by?'- Superseded by: '+d.superseded_by.join(', ')+'\n':'')+
    (d.xrefs&&d.xrefs.length?'- References: '+d.xrefs.join(', ')+'\n':'')+
    (d.authority&&d.authority.length?'- Authority: '+d.authority.join('; ')+'\n':'')+
    (d.note?'- Note: '+d.note+'\n':'')+(d.url?'- URL: '+d.url+'\n':'');
  if(b&&b.text){
    const t=b.text.length>240000?b.text.slice(0,240000)+'\n[truncated]':b.text;
    c+='\nFull extracted text follows (sha256 '+(b.sha256||'').slice(0,12)+'). Answer from THIS TEXT; do not '+
       're-fetch unless asked whether a newer revision exists. Cite section headings and page numbers from it.\n\n'+
       '=== BEGIN '+d.id+' ===\n'+t+'\n=== END '+d.id+' ===\n';
  } else {
    c+='\nFull text is NOT cached. Fetch the URL above ONCE, then answer from what you retrieved. Do not chain '+
       'fetches — if the first does not resolve to the document, say so, give what the metadata supports, and '+
       'link the page. Be concise; speed matters.\n';
  }
  return c;
}
async function run(){
  if(S.busy) return;
  const h=thread();
  const el=addMsg('a',''); el.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  feed.scrollTop=Math.max(0, el.offsetTop-8);
  S.busy=true; S.ctrl=new AbortController();
  const kill=setTimeout(()=>S.ctrl&&S.ctrl.abort('timeout'),HARD);
  $('#stop').hidden=false; $('#send').disabled=true;
  const grounded=!!(S.doc&&(CORPUS.get(S.doc.id)||S.doc.mine));
  const o={grounded,tier:S.fast?'fast':'strong',max_tokens:grounded?2048:1600};
  let last='';
  try{
    const {text,cites}=await withRetry(SYS_BASE+context(),
      h.map(m=>({role:m.role,content:m.content})), S.ctrl.signal,
      a=>{ last=a; el.innerHTML=glossify(md(a)); },
      n=>{ el.innerHTML='<p><em>Busy — retrying ('+n+'/2)…</em></p>'; },
      t=>{ if(!last) el.innerHTML='<div class="tool"><span class="dots"><i></i><i></i><i></i></span>'+
            (t==='web_search_tool_result'?'searching vdot.virginia.gov':'reading the source document')+'</div>'; },
      o);
    h.push({role:'assistant',content:text,cites});
    el.innerHTML=glossify(md(text)); foot(el,text,cites);
    ANSWERS.set(threadKey()+'|'+(h.filter(m=>m.role==='user').slice(-1)[0]||{}).content,text);
    save();
  }catch(err){
    el.remove();
    if(err.name==='AbortError'){
      if(last){ h.push({role:'assistant',content:last}); addMsg('a',last); save(); }
    } else {
      const e=document.createElement('div'); e.className='m e';
      e.textContent = err.empty ? 'The model returned nothing — usually a slow source document. Retry, or open it on VDOT. '
        : /timeout|abort/i.test(String(err.message)) ? 'Timed out reading the source. Build the corpus (tools/build-corpus.py) to answer from cached text. '
        : RETRY(err.message) ? 'Upstream busy after several tries — wait a moment and retry. '
        : err.status===401 ? 'The backend rejected the API key — check ANTHROPIC_API_KEY in your Vercel environment variables. '
        : err.status===403 ? 'Blocked by ALLOWED_ORIGINS — add this domain to that environment variable. '
        : (err.message||'Request failed')+' ';
      const b=document.createElement('button'); b.className='wbtn'; b.textContent='Retry';
      b.addEventListener('click',()=>{ e.remove(); run(); });
      e.appendChild(b); col.appendChild(e); feed.scrollTop=feed.scrollHeight;
    }
  } finally {
    clearTimeout(kill); S.busy=false; S.ctrl=null;
    $('#stop').hidden=true; $('#send').disabled=false;
  }
}
function send(text){
  if(S.busy) return;
  text=(text||'').trim();
  const staged=pending.filter(a=>!a.bad);
  if(!text&&!staged.length) return;
  if(!text) text='Review the attached document'+(staged.length>1?'s':'')+
    ' against the relevant VDOT guidance. Flag anything non-compliant, missing or out of date.';
  const h=thread();
  const selfUp=S.doc&&S.doc.mine?UPLOADS.get(S.doc.id):null;
  const carry=selfUp&&!staged.some(a=>a.id===selfUp.id)?[selfUp]:[];
  let content=text, display=text;
  if(staged.length||carry.length){
    content=[];
    [...carry,...staged].forEach(r=>{
      content.push(blockFor(r,true));
      if(r.kind!=='text') content.push({type:'text',text:'(attached: '+r.name+')'});
    });
    content.push({type:'text',text});
    display=text+'\n📎 '+[...carry,...staged].map(r=>r.name).join(' · ');
    clearFiles();
  }
  h.push({role:'user',content,display});
  addMsg('u',display);
  input.value=''; input.style.height='auto';
  run();
}

/* ---------- 7. Markdown ---------- */
function inline(s){
  return s.replace(/`([^`]+)`/g,(_,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function md(src){
  const lines=esc(src).split('\n');
  let out='',code=false,ul=false,ol=false,para=[],tbl=null;
  const fp=()=>{ if(para.length){ out+='<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
  const fl=()=>{ if(ul){out+='</ul>';ul=false;} if(ol){out+='</ol>';ol=false;} };
  const ft=()=>{ if(tbl){ out+='<table>'+tbl+'</table>'; tbl=null; } };
  const row=(l,c)=>'<tr>'+l.split('|').slice(1,-1).map(x=>'<'+c+'>'+inline(x.trim())+'</'+c+'>').join('')+'</tr>';
  for(let i=0;i<lines.length;i++){
    const raw=lines[i], l=raw.trim();
    if(l.startsWith('```')){ fp(); fl(); ft(); out+=code?'</code></pre>':'<pre><code>'; code=!code; continue; }
    if(code){ out+=raw+'\n'; continue; }
    if(/^\|.*\|$/.test(l)){
      const nx=(lines[i+1]||'').trim();
      if(!tbl&&/^\|[\s:|-]+\|$/.test(nx)){ tbl=row(l,'th'); i++; continue; }
      if(tbl){ tbl+=row(l,'td'); continue; }
    } else ft();
    let m;
    if(!l){ fp(); fl(); continue; }
    if(m=l.match(/^(#{1,3})\s+(.*)/)){ fp(); fl(); out+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>'; continue; }
    if(m=l.match(/^[-*•]\s+(.*)/)){ fp(); if(ol){out+='</ol>';ol=false;} if(!ul){out+='<ul>';ul=true;} out+='<li>'+inline(m[1])+'</li>'; continue; }
    if(m=l.match(/^\d+[.)]\s+(.*)/)){ fp(); if(ul){out+='</ul>';ul=false;} if(!ol){out+='<ol>';ol=true;} out+='<li>'+inline(m[1])+'</li>'; continue; }
    if(m=l.match(/^&gt;\s?(.*)/)){ fp(); fl(); out+='<blockquote>'+inline(m[1])+'</blockquote>'; continue; }
    if(l==='---'||l==='***'){ fp(); fl(); out+='<hr>'; continue; }
    para.push(l);
  }
  fp(); fl(); ft(); if(code) out+='</code></pre>';
  return out;
}

/* ---------- 8. Uploads ---------- */
const MAXF=4*1024*1024, MAXT=12*1024*1024;
let pending=[];
const MINE={id:'mine',code:'MINE',label:'Your documents',hub:null,
  scope:'Documents you uploaded this session. Compared against VDOT guidance, never treated as guidance.'};
const kindOf=f=>/^image\/(png|jpeg|gif|webp)$/.test(f.type)?'image'
  :(f.type==='application/pdf'||/\.pdf$/i.test(f.name))?'pdf'
  :(/^text\//.test(f.type)||/\.(txt|md|csv|tsv|json|xml|html?|log)$/i.test(f.name))?'text':null;
const size=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function addFiles(fs){
  [...fs].forEach(f=>{
    const k=kindOf(f);
    if(!k) return bad(f.name,'unsupported');
    if(f.size>MAXF) return bad(f.name,'over 4 MB');
    if(pending.reduce((n,a)=>n+(a.bytes||0),0)+f.size>MAXT) return bad(f.name,'turn limit');
    const rd=new FileReader();
    rd.onload=()=>{
      const rec={id:'up:'+f.name+':'+f.size,name:f.name,kind:k,bytes:f.size,
        data:k==='text'?rd.result:String(rd.result).split(',')[1],
        mime:f.type||(k==='pdf'?'application/pdf':'text/plain')};
      pending.push(rec); UPLOADS.set(rec.id,rec); registerUpload(rec); drawFiles();
    };
    rd.onerror=()=>bad(f.name,'unreadable');
    k==='text'?rd.readAsText(f):rd.readAsDataURL(f);
  });
}
function bad(name,why){ pending.push({bad:true,name,why}); drawFiles(); }
function registerUpload(rec){
  const docs=S.man.documents;
  if(docs.some(d=>d.id===rec.id)) return;
  if(!S.man.divisions.some(d=>d.id==='mine')) S.man.divisions.push(MINE);
  docs.push({id:rec.id,div:'mine',title:rec.name,kind:rec.kind==='pdf'?'manual':'guide',
    status:'uploaded',mine:true,text:true,url:null,topic:['program delivery'],
    phase:[],delivery:[],district:['Statewide'],
    note:'Uploaded '+new Date().toLocaleString()+' · '+size(rec.bytes)});
  buildDivs(); renderList();
}
function drawFiles(){
  const box=$('#files'); box.hidden=!pending.length; box.innerHTML='';
  pending.forEach((a,i)=>{
    const c=document.createElement('span'); c.className='fchip'+(a.bad?' bad':'');
    const ico=a.kind==='image'
      ?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="m3 11 3-3 3 3 2-2 2 2"/></svg>'
      :'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg>';
    c.innerHTML=(a.bad?'':ico)+'<b></b><i>'+esc(a.bad?a.why:size(a.bytes))+'</i>';
    c.querySelector('b').textContent=a.name;
    const x=document.createElement('button'); x.className='x'; x.textContent='×';
    x.addEventListener('click',()=>{ pending.splice(i,1); drawFiles(); });
    c.appendChild(x); box.appendChild(c);
  });
}
function clearFiles(){ pending=[]; drawFiles(); }
function blockFor(r,cache){
  if(r.kind==='image') return {type:'image',source:{type:'base64',media_type:r.mime,data:r.data}};
  if(r.kind==='pdf'){ const b={type:'document',source:{type:'base64',media_type:'application/pdf',data:r.data},
      title:r.name,citations:{enabled:true}}; if(cache) b.cache_control={type:'ephemeral'}; return b; }
  const t={type:'text',text:'--- FILE: '+r.name+' ---\n'+String(r.data).slice(0,180000)};
  if(cache) t.cache_control={type:'ephemeral'}; return t;
}
$('#attach').addEventListener('click',()=>$('#file-in').click());
$('#file-in').addEventListener('change',e=>{ addFiles(e.target.files); e.target.value=''; });
input.addEventListener('paste',e=>{
  const it=[...(e.clipboardData?e.clipboardData.items:[])].filter(i=>i.kind==='file');
  if(it.length) addFiles(it.map(i=>i.getAsFile()).filter(Boolean));
});
(function(){
  const z=$('#drop'), w=$('#work'); let n=0;
  ['dragenter','dragover'].forEach(ev=>w.addEventListener(ev,e=>{

function relatedTo(d,limit){
  return (S.man.documents||[]).filter(x=>x.id!==d.id).map(x=>{
    let s=0;
    (d.topic||[]).forEach(t=>{ if((x.topic||[]).includes(t)) s+=3; });
    (d.phase||[]).forEach(t=>{ if((x.phase||[]).includes(t)) s+=1; });
    (d.delivery||[]).forEach(t=>{ if((x.delivery||[]).includes(t)) s+=1; });
    if(x.div===d.div) s+=2; if(x.kind===d.kind) s+=.5;
    return [x,s];
  }).filter(p=>p[1]>=4).sort((a,b)=>b[1]-a[1]).slice(0,limit||6).map(p=>p[0]);
}
