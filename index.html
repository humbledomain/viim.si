    H('Classification'); const w=HTML('');
    ff.forEach(([f])=>(d[f]||[]).forEach(v=>{
      const x=document.createElement('button'); x.className='tg'; x.textContent=v;
      x.addEventListener('click',()=>{ F[f].add(v); FTAB=f;
        $$('.ftab').forEach(t=>t.classList.toggle('on',t.dataset.f===f));
        renderFacets(); renderChips(); renderList(); save(); });
      w.appendChild(x);
    }));
  }
  if(d.sections&&d.sections.length){
    H('Sections');
    d.sections.slice(0,40).forEach(s=>{
      const x=document.createElement('button'); x.className='sc';
      x.innerHTML=esc(s.heading)+'<i>p.'+s.page+'</i>';
      x.addEventListener('click',()=>send('In '+d.id+', explain section “'+s.heading+'” (page '+s.page+'). Quote the operative language and say what it requires.'));
      b.appendChild(x);
    });
  } else if(!d.text){ H('Sections'); HTML('<div class="mute">Section map appears after <code>tools/build-corpus.py</code> runs.</div>'); }
  const rel=[...new Set([...(d.xrefs||[]),...(d.referenced_by||[])])];
  if(rel.length){
    H('Cross-references'); const w=HTML('');
    rel.slice(0,30).forEach(id=>{
      const t=(S.man.documents||[]).find(x=>x.id===id);
      const x=document.createElement('button'); x.className='rf'; x.textContent=id;
      x.title=t?t.title:'not in index';
      x.addEventListener('click',()=>t?selectDoc(t):send('What is '+id+', and how does it relate to '+d.id+'?'));
      w.appendChild(x);
    });
  }
  const near=relatedTo(d);
  if(near.length){
    H('Related guidance');
    near.forEach(x=>{ const r=document.createElement('button'); r.className='rl';
      r.innerHTML='<b>'+esc(x.id)+'</b>'+esc(x.title);
      r.addEventListener('click',()=>selectDoc(x)); b.appendChild(r); });
  }
  if(d.supersedes||d.superseded_by){ H('Lineage');
    HTML((d.supersedes?kv('Supersedes',d.supersedes.join(', ')):'')+
         (d.superseded_by?kv('Superseded by',d.superseded_by.join(', ')):'')); }
  if(d.authority&&d.authority.length){ H('Authority cited'); HTML('<div class="auth">'+d.authority.map(esc).join('<br>')+'</div>'); }
  if(d.note){ H('Note'); HTML('<div class="mute">'+esc(d.note)+'</div>'); }
  H('Report');
  A('Report an error in this entry',I.cp,()=>{
    const url='https://github.com/YOURORG/viim/issues/new?title='+encodeURIComponent('Index error: '+d.id)+
      '&body='+encodeURIComponent('Document: '+d.id+'\nTitle: '+d.title+'\nURL: '+(d.url||'')+'\n\nWhat is wrong:\n');
    window.open(url,'_blank','noopener');
  });
}
function closeCtx(){ $('#ctx').hidden=true; document.body.classList.remove('ctx'); }
$('#ctx-close').addEventListener('click',closeCtx);
$('#ctx-btn').addEventListener('click',()=>{ $('#ctx').hidden?renderCtx():closeCtx(); });

/* ---------- 10. Roles ---------- */
function setRole(id,quiet){
  S.role=ROLES[id]?id:'consultant';
  $('#role-name').textContent=ROLES[S.role].name;
  if(!quiet){
    const r=ROLES[S.role];
    Object.keys(F).forEach(f=>F[f].clear());
    Object.entries(r.facets||{}).forEach(([f,vals])=>vals.forEach(v=>F[f]&&F[f].add(v)));
    if(r.div) setDiv(r.div,true);
    buildDivs(); renderFacets(); renderChips(); renderList(); paintWork(); save();
    toast('Tuned for '+r.name);
  }
}
$('#role-btn').addEventListener('click',()=>{
  const box=modal('<h3>Who are you working as?</h3>'+
    '<p class="lead">This tunes the default filters, the four quick questions, and how answers are framed. Change it any time.</p>'+
    '<div class="roles">'+Object.entries(ROLES).map(([k,r])=>
      '<button class="role'+(k===S.role?' on':'')+'" data-r="'+k+'"><b>'+esc(r.name)+'</b><span>'+esc(r.blurb)+'</span></button>').join('')+'</div>');
  box.querySelectorAll('.role').forEach(b=>b.addEventListener('click',()=>{ setRole(b.dataset.r); closeModal(); }));
});

/* ---------- 11. Glossary ---------- */
let GLOSSARY={};
function glossify(html){
  const keys=Object.keys(GLOSSARY); if(!keys.length) return html;
  const re=new RegExp('\\b('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','g');
  return html.replace(/>([^<]+)</g,(m,txt)=>'>'+txt.replace(re,'<span class="gl" data-g="$1">$1</span>')+'<');
}
document.addEventListener('mouseover',e=>{
  const g=e.target.closest('.gl'); if(!g) return;
  const k=g.dataset.g, v=GLOSSARY[k]; if(!v) return;
  const t=$('#tip'); t.hidden=false;
  t.innerHTML='<b>'+esc(k)+'</b>'+esc(typeof v==='string'?v:v.def||'');
  const r=g.getBoundingClientRect();
  t.style.left=Math.min(innerWidth-300,Math.max(8,r.left))+'px';
  t.style.top=(r.bottom+8)+'px';
});
document.addEventListener('mouseout',e=>{ if(e.target.closest('.gl')) $('#tip').hidden=true; });
$('#gloss-btn').addEventListener('click',()=>{
  const rows=Object.entries(GLOSSARY).sort((a,b)=>a[0].localeCompare(b[0]));
  modal('<h3>VDOT acronyms and terms</h3><p class="lead">'+rows.length+
    ' entries. They are underlined wherever they appear in an answer — hover for the definition.</p>'+
    '<div class="body"><dl class="gl-list">'+rows.map(([k,v])=>
      '<dt>'+esc(k)+'</dt><dd>'+esc(typeof v==='string'?v:v.def||'')+'</dd>').join('')+'</dl></div>');
});

/* ---------- 12. Compare ---------- */
$('#cmp-btn').addEventListener('click',()=>{
  const opts=(S.man.documents||[]).map(d=>'<option value="'+esc(d.id)+'">'+esc(d.id+' — '+d.title)+'</option>').join('');
  const box=modal('<h3>Compare two documents</h3>'+
    '<p class="lead">Requirement-by-requirement, with the differences that matter in practice.</p>'+
    '<div style="padding:0 18px 16px;display:flex;flex-direction:column;gap:9px">'+
    '<select id="cA" style="padding:9px;border:1px solid var(--line2);border-radius:8px">'+opts+'</select>'+
    '<select id="cB" style="padding:9px;border:1px solid var(--line2);border-radius:8px">'+opts+'</select>'+
    '<button class="wbtn p" id="cGo" style="justify-content:center">Compare</button></div>');
  if(S.doc) box.querySelector('#cA').value=S.doc.id;
  box.querySelector('#cGo').addEventListener('click',()=>{
    const a=box.querySelector('#cA').value, b=box.querySelector('#cB').value;
    closeModal();
    if(a===b) return toast('Pick two different documents');
    const da=(S.man.documents||[]).find(x=>x.id===a), db=(S.man.documents||[]).find(x=>x.id===b);
    selectDoc(da);
    send('Compare '+a+' and '+b+' requirement by requirement. Use a table with the requirement, what '+a+
      ' says, what '+b+' says, and which controls when they overlap. Then a short note on where a practitioner '+
      'most often trips between the two. Titles for reference: '+a+' — '+(da?da.title:'')+'; '+b+' — '+(db?db.title:'')+'.');
  });
});

/* ---------- 13. Command palette ---------- */
let palSel=0, palItems=[];
function openPal(){
  const box=modal('<input class="q" id="pq" placeholder="Documents, divisions, acronyms…" autocomplete="off">'+
    '<div class="body" id="pl"></div>'+
    '<div class="hint"><span><kbd>↑↓</kbd>navigate</span><span><kbd>↵</kbd>open</span><span><kbd>esc</kbd>close</span></div>');
  const q=box.querySelector('#pq');
  palFill('');
  q.addEventListener('input',()=>palFill(q.value));
  q.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); palMove(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); palMove(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); palItems[palSel]&&palItems[palSel].go(); }
  });
  setTimeout(()=>q.focus(),20);
}
function palFill(q){
  const list=document.querySelector('#pl'); if(!list) return;
  const ql=q.toLowerCase(); palItems=[]; palSel=0;
  (S.man.divisions||[]).forEach(d=>{ if(!ql||(d.label+d.code).toLowerCase().includes(ql))
    palItems.push({id:d.code,tx:d.label,k:'division',go:()=>{ setDiv(d.id); closeModal(); }}); });
  (S.man.documents||[]).forEach(d=>{ if(!ql||(d.id+' '+d.title).toLowerCase().includes(ql))
    palItems.push({id:d.id,tx:d.title,k:d.kind||'doc',go:()=>{ selectDoc(d); closeModal(); }}); });
  Object.keys(GLOSSARY).forEach(k=>{ if(ql&&k.toLowerCase().includes(ql))
    palItems.push({id:k,tx:(typeof GLOSSARY[k]==='string'?GLOSSARY[k]:GLOSSARY[k].def||''),k:'term',
      go:()=>{ closeModal(); send('What does '+k+' mean in VDOT practice, and which documents govern it?'); }}); });
  if(ql) palItems.unshift({id:'Ask',tx:q,k:'question',go:()=>{ closeModal(); send(q); }});
  palItems=palItems.slice(0,60);
  list.innerHTML='';
  palItems.forEach((it,i)=>{
    const b=document.createElement('button'); b.className='row'+(i===0?' sel':'');
    b.innerHTML='<span class="rid">'+esc(it.id)+'</span><span class="rtx">'+esc(it.tx)+'</span><span class="rk">'+esc(it.k)+'</span>';
    b.addEventListener('click',it.go); list.appendChild(b);
  });
}
function palMove(d){
  const items=document.querySelectorAll('#pl .row'); if(!items.length) return;
  items[palSel]&&items[palSel].classList.remove('sel');
  palSel=(palSel+d+items.length)%items.length;
  items[palSel].classList.add('sel'); items[palSel].scrollIntoView({block:'nearest'});
}
$('#gsearch').addEventListener('click',openPal);

/* modal plumbing */
function modal(html){
  closeModal();
  const ov=document.createElement('div'); ov.className='ov'; ov.id='modal';
  const bx=document.createElement('div'); bx.className='box'; bx.innerHTML=html;
  ov.appendChild(bx); document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  return bx;
}
function closeModal(){ const m=$('#modal'); m&&m.remove(); }

/* ---------- 14. Export / print / share ---------- */
function threadMarkdown(){
  const d=S.doc, when=new Date().toLocaleString();
  let out='# VIIM — '+(d?d.id+' · '+d.title:'VDOT guidance')+'\n\n';
  out+='_Exported '+when+' · role: '+ROLES[S.role].name+'_\n\n';
  if(d){ out+='**Document:** '+d.id+(d.revision?' rev '+d.revision:'')+'  \n';
    if(d.effective) out+='**Effective on file:** '+d.effective+'  \n';
    if(d.url) out+='**Source:** '+d.url+'  \n'; out+='\n---\n\n'; }
  thread().forEach(m=>{
    const body=typeof m.content==='string'?m.content:(m.display||'[attachment]');
    out+=(m.role==='user'?'## Question\n\n':'## Answer\n\n')+body+'\n\n';
    if(m.cites&&m.cites.length) out+='Sources: '+m.cites.join(' · ')+'\n\n';
  });
  out+='\n---\n\nUnofficial reference output. Not VDOT approval and not engineering judgment. '+
       'Confirm the current revision on vdot.virginia.gov before relying on this for design or submittal.\n';
  return out;
}
$('#export-btn').addEventListener('click',()=>{
  if(!thread().length) return toast('Nothing to export yet');
  const blob=new Blob([threadMarkdown()],{type:'text/markdown'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='viim-'+(S.doc?slugOf(S.doc.id):'thread')+'.md';
  a.click(); URL.revokeObjectURL(a.href); toast('Exported');
});
$('#print-btn').addEventListener('click',()=>{
  const d=S.doc;
  $('#printfoot').innerHTML='VIIM — unofficial reference output · printed '+new Date().toLocaleString()+
    (d?' · '+esc(d.id)+(d.revision?' rev '+esc(d.revision):'')+(d.url?' · '+esc(d.url):''):'')+
    '<br>Not VDOT approval and not engineering judgment. Confirm the current revision on vdot.virginia.gov before relying on this for design or submittal.';
  print();
});
$('#share-btn').addEventListener('click',()=>{
  writeHash();
  navigator.clipboard&&navigator.clipboard.writeText(location.href);
  toast('Link copied');
});

/* ---------- 15. Deep links ---------- */
function writeHash(){
  const p=[];
  if(S.doc&&!S.doc.mine) p.push('doc='+encodeURIComponent(S.doc.id));
  else if(S.div) p.push('div='+encodeURIComponent(S.div));
  const h=p.join('&');
  if(('#'+h)!==location.hash) history.replaceState(null,'','#'+h);
}
function readHash(){
  const h=location.hash.replace(/^#/,''); if(!h) return false;
  const p=new URLSearchParams(h);
  const id=p.get('doc'), dv=p.get('div'), q=p.get('q');
  if(dv) setDiv(dv,true);
  if(id){
    const d=(S.man.documents||[]).find(x=>x.id===id);
    if(d){ if(d.div) setDiv(d.div,true); selectDoc(d,true); }
  }
  buildDivs(); renderList(); paintWork();
  if(q) setTimeout(()=>send(decodeURIComponent(q)),400);
  return !!(id||dv||q);
}
addEventListener('hashchange',()=>readHash());

/* ---------- 16. Keys & chrome ---------- */
$('#menu').addEventListener('click',()=>document.body.classList.toggle('idx'));
$('#scrim').addEventListener('click',()=>document.body.classList.remove('idx'));
$('#brand').addEventListener('click',e=>{ e.preventDefault(); selectDoc(null); setDiv(null); });
addEventListener('keydown',e=>{
  const typing=/input|textarea|select/i.test(e.target.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('#modal')?closeModal():openPal(); return; }
  if(e.key==='Escape'){ if($('#modal')) return closeModal();
    if(recOn&&rec) return rec.stop();
    if(!$('#ctx').hidden) return closeCtx();
    if(document.body.classList.contains('idx')) return document.body.classList.remove('idx');
    if(typing) e.target.blur(); return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key==='j'||e.key==='k'||e.key==='ArrowDown'&&!typing||e.key==='ArrowUp'&&!typing){
    const items=$$('#list .it'); if(!items.length) return;
    e.preventDefault();
    S.cur=Math.max(0,Math.min(items.length-1,S.cur+((e.key==='j'||e.key==='ArrowDown')?1:-1)));
    items.forEach(i=>i.classList.remove('cur'));
    items[S.cur].classList.add('cur'); items[S.cur].scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Enter'&&S.cur>=0){ const items=$$('#list .it'); items[S.cur]&&items[S.cur].click(); }
});

/* ---------- 17. Voice ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, recOn=false;
if(!SR) $('#mic').hidden=true;
$('#mic').addEventListener('click',()=>{
  if(!SR) return;
  if(recOn){ rec.stop(); return; }
  rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang=navigator.language||'en-US';
  rec.onresult=e=>{ let f='';
    for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) f+=e.results[i][0].transcript;
    if(f){ input.value=(input.value?input.value.replace(/\s*$/,' '):'')+f.trim();
      input.dispatchEvent(new Event('input')); } };
  const off=()=>{ recOn=false; $('#mic').classList.remove('rec'); $('#mic').setAttribute('aria-pressed','false'); };
  rec.onend=off; rec.onerror=off;
  try{ rec.start(); recOn=true; $('#mic').classList.add('rec'); $('#mic').setAttribute('aria-pressed','true'); }catch(e){}
});

boot();
